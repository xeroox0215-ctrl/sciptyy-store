<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sciptyy Cases</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #f39c12; }
        .case { background: #2c2c2c; border-radius: 15px; padding: 20px; margin-bottom: 20px; width: 90%; max-width: 400px; text-align: center; }
        .price { color: #2ecc71; font-size: 20px; font-weight: bold; margin: 10px 0; }
        .btn { background: #e67e22; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 18px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔥 Кейсы Sciptyy Store</h1>
    <div class="case">
        <h2>📦 Обычный кейс</h2>
        <div class="price">99 ₽</div>
        <!-- Кнопка ведет сразу в бота с командой -->
        <button class="btn" onclick="window.location.href='https://t.me/sciptyy_storebot?start=buy_normal_99'">Купить и открыть</button>
    </div>
    <div class="case">
        <h2>👑 VIP Кейс</h2>
        <div class="price">249 ₽</div>
        <!-- Кнопка ведет сразу в бота с командой -->
        <button class="btn" onclick="window.location.href='https://t.me/sciptyy_storebot?start=buy_vip_249'">Купить и открыть</button>
    </div>
</body>
</html>
