<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sciptyy Space Cases</title>
    <style>
        /* Космический фон */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at bottom, #1b2735 0%, #090a0f 100%);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Звезды на фоне */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 5s infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        h1 {
            margin-top: 30px;
            font-size: 32px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00c6ff, #0072ff, #00c6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 3s infinite alternate;
        }
        @keyframes glow {
            from { filter: drop-shadow(0 0 5px #00c6ff); }
            to { filter: drop-shadow(0 0 20px #0072ff); }
        }

        /* Карточки кейсов */
        .case-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            width: 85%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .case-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 32px 0 rgba(0, 198, 255, 0.3);
        }
        
        .price {
            font-size: 24px;
            font-weight: bold;
            color: #00ff87;
            text-shadow: 0 0 10px rgba(0, 255, 135, 0.5);
            margin: 10px 0;
        }

        .btn {
            background: linear-gradient(45deg, #0072ff, #00c6ff);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: 0.3s;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.8);
        }

        /* Экран анимации */
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.95);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            perspective: 1000px;
            overflow: hidden;
        }

        .case-3d {
            width: 150px; height: 150px;
            background: url('https://cdn-icons-png.flaticon.com/512/679/679720.png') no-repeat center center;
            background-size: contain;
            position: absolute;
            transition: transform 1s ease-in;
            z-index: 10;
            filter: drop-shadow(0 0 15px #00c6ff);
        }

        /* Разлетающиеся элементы */
        .flying-item {
            position: absolute;
            font-size: 40px;
            opacity: 0;
            transition: all 2.5s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 5;
            filter: drop-shadow(0 0 10px #fff);
        }

        /* Карточка выигрыша */
        #win-card {
            display: none;
            background: rgba(20, 20, 30, 0.9);
            border: 2px solid #00c6ff;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transform: scale(0);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 0 40px rgba(0, 198, 255, 0.6);
        }
        #win-card.active { transform: scale(1); }
        .win-title {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00c6ff;
        }
        .win-sub { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .close-btn {
            background: linear-gradient(45deg, #00ff87, #60efff);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 255, 135, 0.4);
        }
    </script>
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <h1>🚀 Sciptyy Space Cases</h1>

    <div class="case-container">
        <h2>📦 Обычный кейс</h2>
        <div class="price">99 ₽</div>
        <button class="btn" onclick="startAnimation(99, 'normal')">Купить и открыть</button>
    </div>

    <div class="case-container">
        <h2>👑 VIP Кейс</h2>
        <div class="price">249 ₽</div>
        <button class="btn" onclick="startAnimation(249, 'vip')">Купить и открыть</button>
    </div>

    <!-- Экран анимации -->
    <div id="overlay">
        <div class="case-3d" id="case3d"></div>
        <div id="win-card">
            <div class="win-title" id="win-text">🎉 Вы выиграли!</div>
            <div class="win-sub">Зайдите в бота, чтобы получить приз!</div>
            <button class="close-btn" onclick="finishGame()">Забрать в боте</button>
        </div>
    </div>

    <script>
        function startAnimation(price, type) {
            let overlay = document.getElementById('overlay');
            let case3d = document.getElementById('case3d');
            let winCard = document.getElementById('win-card');
            let winText = document.getElementById('win-text');

            overlay.style.display = 'flex';
            case3d.style.transform = 'translateZ(0) scale(1) rotate(0deg)';
            case3d.style.opacity = '1';
            winCard.style.display = 'none';
            winCard.classList.remove('active');

            // Удаляем старые элементы
            document.querySelectorAll('.flying-item').forEach(e => e.remove());

            // Анимация: приближаем и взрываем
            setTimeout(() => {
                case3d.style.transform = 'translateZ(400px) scale(1.5) rotate(15deg)';
                
                // Спавним частицы
                for (let i = 0; i < 25; i++) {
                    let item = document.createElement('div');
                    item.className = 'flying-item';
                    item.innerText = ['💰', '🇺🇸', '🎁', '⭐', '🔥', '💎'][Math.floor(Math.random() * 6)];
                    item.style.left = '50%';
                    item.style.top = '50%';
                    overlay.appendChild(item);
                    
                    setTimeout(() => {
                        let x = (Math.random() - 0.5) * 800;
                        let y = (Math.random() - 0.5) * 800;
                        item.style.transform = `translate(${x}px, ${y}px) scale(1.2) rotate(${Math.random()*360}deg)`;
                        item.style.opacity = '1';
                    }, 50);
                }
            }, 500);

            // Результат через 2.5 секунды
            setTimeout(() => {
                case3d.style.opacity = '0';
                winCard.style.display = 'block';
                setTimeout(() => { winCard.classList.add('active'); }, 50);
                
                // Выдаем случайный приз для визуала
                let prizes = ["📱 США за 50₽", "🎁 Промокод 10%", "💰 5 Рублей", "🔥 США за 300₽", "💎 VIP Промокод 50%"];
                winText.innerText = "🎉 Вы выиграли:\n" + prizes[Math.floor(Math.random() * prizes.length)];
            }, 2500);

            // Перекидываем в бота через 5 секунд
            setTimeout(() => {
                window.location.href = `https://t.me/sciptyy_storebot?start=buy_${type}_${price}`;
            }, 5000); 
        }

        function finishGame() {
            window.location.href = `https://t.me/sciptyy_storebot`;
        }
    </script>
</body>
</html>
