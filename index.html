<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sciptyy Cases</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #f39c12; text-align: center; }
        .case {
            background: #2c2c2c;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .price { color: #2ecc71; font-size: 20px; font-weight: bold; margin: 10px 0; }
        .btn {
            background: #e67e22;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:active { background: #d35400; transform: scale(0.98); }
    </style>
</head>
<body>
    <h1>🔥 Кейсы Sciptyy Store</h1>

    <div class="case">
        <h2>📦 Обычный кейс</h2>
        <div class="price">99 ₽</div>
        <button class="btn" onclick="buyCase(99, 'normal')">Купить и открыть</button>
    </div>

    <div class="case">
        <h2>👑 VIP Кейс</h2>
        <div class="price">249 ₽</div>
        <button class="btn" onclick="buyCase(249, 'vip')">Купить и открыть</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function buyCase(price, type) {
            tg.sendData(JSON.stringify({ action: 'buy_case', price: price, type: type }));
            tg.close();
        }
    </script>
</body>
</html>
