<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sciptyy Space Cases</title>
    <style>
        /* Космический фон (приглушенный) */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at bottom, #111622 0%, #06080c 100%);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Звезды на фоне */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #5a6a80, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #4a5a70, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 160px, #3a4a60, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #6a7a90, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #4a5a70, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 160px 120px, #3a4a60, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 6s infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.4; }
        }

        h1 {
            margin-top: 30px;
            font-size: 28px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #4a80a0, #2a5a80, #4a80a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 4s infinite alternate;
        }
        @keyframes glow {
            from { filter: drop-shadow(0 0 3px #4a80a0); }
            to { filter: drop-shadow(0 0 10px #2a5a80); }
        }

        /* Карточки кейсов */
        .case-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            width: 85%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }
        
        .price {
            font-size: 22px;
            font-weight: bold;
            color: #4ade80; /* Приглушенный зеленый */
            text-shadow: 0 0 5px rgba(74, 222, 128, 0.3);
            margin: 10px 0;
        }

        .btn {
            background: linear-gradient(45deg, #2a5a80, #4a80a0);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(42, 90, 128, 0.3);
            transition: 0.3s;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(74, 128, 160, 0.6);
        }

        /* Экран анимации */
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 10, 0.95);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            perspective: 1200px;
            overflow: hidden;
        }

        /* Кейс вылетает из глубины */
        .case-3d {
            width: 120px; height: 120px;
            background: url('https://cdn-icons-png.flaticon.com/512/679/679720.png') no-repeat center center;
            background-size: contain;
            position: absolute;
            transform: translateZ(-800px) scale(0.1);
            transition: transform 2s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 10;
            filter: drop-shadow(0 0 10px #4a80a0);
        }
        
        /* Состояние, когда кейс подлетел */
        .case-3d.arrived {
            transform: translateZ(200px) scale(1.2) rotate(5deg);
        }

        /* Состояние, когда кейс взрывается */
        .case-3d.explode {
            transform: translateZ(400px) scale(2) rotate(-10deg);
            opacity: 0;
            transition: all 1.5s ease-out;
        }

        /* Разлетающиеся элементы */
        .flying-item {
            position: absolute;
            font-size: 40px;
            opacity: 0;
            transform: translate(0, 0) scale(0.5);
            transition: all 3s cubic-bezier(0.1, 0.8, 0.3, 1);
            z-index: 5;
            filter: drop-shadow(0 0 8px #fff);
        }

        /* Карточка выигрыша */
        #win-card {
            display: none;
            background: rgba(15, 20, 30, 0.95);
            border: 2px solid #4a80a0;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transform: scale(0);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 0 30px rgba(74, 128, 160, 0.4);
        }
        #win-card.active { transform: scale(1); }
        
        .win-title {
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 5px #4a80a0;
        }
        .win-sub { color: #8a9ab0; font-size: 14px; margin-bottom: 20px; }
        
        .close-btn {
            background: linear-gradient(45deg, #2a5a80, #4a80a0);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(42, 90, 128, 0.3);
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <h1>🚀 Sciptyy Space Cases</h1>

    <div class="case-container">
        <h2>📦 Обычный кейс</h2>
        <div class="price">99 ₽</div>
        <button class="btn" onclick="startAnimation(99, 'normal')">Купить и открыть</button>
    </div>

    <div class="case-container">
        <h2>👑 VIP Кейс</h2>
        <div class="price">249 ₽</div>
        <button class="btn" onclick="startAnimation(249, 'vip')">Купить и открыть</button>
    </div>

    <!-- Экран анимации -->
    <div id="overlay">
        <div class="case-3d" id="case3d"></div>
        <div id="win-card">
            <div class="win-title" id="win-text">🎉 Вы выиграли!</div>
            <div class="win-sub">Зайдите в бота, чтобы получить приз!</div>
            <button class="close-btn" onclick="finishGame()">Забрать в боте</button>
        </div>
    </div>

    <script>
        function startAnimation(price, type) {
            let overlay = document.getElementById('overlay');
            let case3d = document.getElementById('case3d');
            let winCard = document.getElementById('win-card');
            let winText = document.getElementById('win-text');

            // 1. Сброс и показ экрана
            overlay.style.display = 'flex';
            case3d.className = 'case-3d'; // Сброс классов
            winCard.style.display = 'none';
            winCard.classList.remove('active');
            document.querySelectorAll('.flying-item').forEach(e => e.remove());

            // 2. Кейс вылетает из глубины (2 секунды)
            setTimeout(() => {
                case3d.classList.add('arrived');
            }, 100);

            // 3. Кейс висит, а затем взрывается (еще через 1.5 сек)
            setTimeout(() => {
                case3d.classList.add('explode');
                
                // Спавним частицы, которые медленно разлетаются
                for (let i = 0; i < 30; i++) {
                    let item = document.createElement('div');
                    item.className = 'flying-item';
                    item.innerText = ['💰', '🇺🇸', '🎁', '⭐', '🔥', '💎'][Math.floor(Math.random() * 6)];
                    item.style.left = '50%';
                    item.style.top = '50%';
                    overlay.appendChild(item);
                    
                    // Запускаем анимацию разлета с задержкой
                    setTimeout(() => {
                        let x = (Math.random() - 0.5) * 1000;
                        let y = (Math.random() - 0.5) * 1000;
                        item.style.transform = `translate(${x}px, ${y}px) scale(1.5) rotate(${Math.random()*720}deg)`;
                        item.style.opacity = '1';
                    }, 50);
                }
            }, 2500); // Ждем 2.5 сек (2 сек на вылет + 0.5 на зависание)

            // 4. Показ карточки выигрыша (еще через 1.5 сек)
            setTimeout(() => {
                winCard.style.display = 'block';
                setTimeout(() => { winCard.classList.add('active'); }, 50);
                
                // Рандомный текст для визуала
                let prizes = ["📱 США за 50₽", "🎁 Промокод 10%", "💰 5 Рублей", "🔥 США за 300₽", "💎 VIP Промокод 50%"];
                winText.innerText = "🎉 Вы выиграли:\n" + prizes[Math.floor(Math.random() * prizes.length)];
            }, 4000);

            // 5. Перекидываем в бота через 7 секунд (чтобы юзер успел насладиться)
            setTimeout(() => {
                window.location.href = `https://t.me/sciptyy_storebot?start=buy_${type}_${price}`;
            }, 7000); 
        }

        function finishGame() {
            window.location.href = `https://t.me/sciptyy_storebot`;
        }
    </script>
</body>
</html>
