<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sciptyy Cases</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        h1 { color: #f39c12; text-align: center; margin-bottom: 20px; }
        
        .case-container { background: #2c2c2c; border-radius: 15px; padding: 20px; margin-bottom: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; }
        .price { color: #2ecc71; font-size: 20px; font-weight: bold; margin: 10px 0; }
        .btn { background: #e67e22; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; width: 100%; cursor: pointer; transition: 0.2s; margin-bottom: 10px;}
        .btn:active { background: #d35400; transform: scale(0.98); }
        .btn-cancel { background: #c0392b; }
        .btn-cancel:active { background: #e74c3c; }

        /* Экран анимации (скрыт по умолчанию) */
        #animation-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .roulette { width: 100%; height: 150px; overflow: hidden; position: relative; background: #222; border-top: 2px solid #f39c12; border-bottom: 2px solid #f39c12; display: flex; align-items: center; justify-content: center; }
        .roulette-items { display: flex; gap: 10px; font-size: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .prize-screen { display: none; text-align: center; }
        .prize-text { font-size: 24px; font-weight: bold; color: #f1c40f; margin-bottom: 20px; }
        .close-btn { background: #27ae60; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }

        /* Модальное окно подтверждения */
        #confirm-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: #2c2c2c; padding: 20px; border-radius: 15px; text-align: center; width: 80%; max-width: 300px; }
        .modal-text { margin-bottom: 20px; font-size: 18px; }
    </style>
</head>
<body>
    <h1>🔥 Кейсы Sciptyy Store</h1>

    <!-- Меню выбора -->
    <div id="menu-screen">
        <div class="case-container">
            <h2>📦 Обычный кейс</h2>
            <div class="price">99 ₽</div>
            <button class="btn" onclick="showConfirm(99, 'normal')">Купить и открыть</button>
        </div>
        <div class="case-container">
            <h2>👑 VIP Кейс</h2>
            <div class="price">249 ₽</div>
            <button class="btn" onclick="showConfirm(249, 'vip')">Купить и открыть</button>
        </div>
    </div>

    <!-- Модальное окно подтверждения -->
    <div id="confirm-modal">
        <div class="modal-content">
            <div class="modal-text">Списать с баланса <span id="confirm-price"></span> ₽?</div>
            <button class="btn" onclick="confirmBuy()">✅ Да, купить</button>
            <button class="btn btn-cancel" onclick="closeModal()">❌ Отмена</button>
        </div>
    </div>

    <!-- Экран анимации -->
    <div id="animation-screen">
        <div id="spin-view" class="roulette">
            <div class="roulette-items">📦 💰 🎁 👑 🔥 💸 📱</div>
        </div>
        <div id="prize-view" class="prize-screen">
            <div class="prize-text" id="prize-text">✅ Кейс куплен!<br>Зайдите в бота, чтобы открыть его.</div>
            <button class="close-btn" onclick="closeGame()">Понятно</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let selectedPrice = 0;
        let selectedType = '';

        function showConfirm(price, type) {
            selectedPrice = price;
            selectedType = type;
            document.getElementById('confirm-price').innerText = price;
            document.getElementById('confirm-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('confirm-modal').style.display = 'none';
        }

        function confirmBuy() {
            closeModal();
            
            // Отправляем данные боту (он спишет деньги и выдаст кейс)
            tg.sendData(JSON.stringify({ action: 'buy_case', price: selectedPrice, type: selectedType }));

            // Запускаем анимацию на сайте
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('animation-screen').style.display = 'flex';
            
            setTimeout(() => {
                document.getElementById('spin-view').style.display = 'none';
                document.getElementById('prize-view').style.display = 'block';
            }, 3000); // Крутим 3 секунды
        }

        function closeGame() {
            tg.close();
        }
    </script>
</body>
</html>
