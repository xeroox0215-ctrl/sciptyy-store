<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sciptyy Cases</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        h1 { color: #f39c12; text-shadow: 0 0 10px #f39c12; text-align: center; margin-bottom: 20px; }
        
        .case { background: linear-gradient(145deg, #2a2a2a, #1a1a1a); border-radius: 20px; padding: 20px; margin-bottom: 20px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .price { color: #2ecc71; font-size: 22px; font-weight: bold; margin: 10px 0; }
        .btn { background: linear-gradient(90deg, #e67e22, #d35400); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: bold; width: 100%; cursor: pointer; text-decoration: none; display: block; transition: 0.3s; }
        .btn:active { transform: scale(0.95); }

        /* Экран анимации */
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 100; overflow: hidden; perspective: 1000px; }
        
        /* Сам кейс */
        .case-3d { width: 150px; height: 150px; background: url('https://cdn-icons-png.flaticon.com/512/679/679720.png') no-repeat center center; background-size: contain; position: absolute; transition: transform 1s ease-in; z-index: 10; }
        
        /* Взрыв кейса и разлетающиеся элементы */
        .flying-item { position: absolute; font-size: 40px; opacity: 0; transition: all 2s cubic-bezier(0.25, 1, 0.5, 1); z-index: 5; }
        
        /* Карточка выигрыша */
        #win-card { display: none; background: linear-gradient(145deg, #2a2a2a, #1a1a1a); border: 2px solid #f39c12; border-radius: 20px; padding: 30px; text-align: center; transform: scale(0); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 20; width: 80%; max-width: 300px; box-shadow: 0 0 30px rgba(243, 156, 18, 0.5); }
        #win-card.active { transform: scale(1); }
        .win-title { color: #f1c40f; font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .win-sub { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .close-btn { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <h1>🔥 Кейсы Sciptyy Store</h1>

    <div class="case">
        <h2>📦 Обычный кейс</h2>
        <div class="price">99 ₽</div>
        <button class="btn" onclick="startAnimation(99, 'normal')">Купить и открыть</button>
    </div>

    <div class="case">
        <h2>👑 VIP Кейс</h2>
        <div class="price">249 ₽</div>
        <button class="btn" onclick="startAnimation(249, 'vip')">Купить и открыть</button>
    </div>

    <!-- Экран анимации -->
    <div id="overlay">
        <div class="case-3d" id="case3d"></div>
        <div id="win-card">
            <div class="win-title" id="win-text">🎉 Вы выиграли!</div>
            <div class="win-sub">Зайдите в бота, чтобы получить приз!</div>
            <button class="close-btn" onclick="finishGame()">Забрать в боте</button>
        </div>
    </div>

    <script>
        // Мы используем localStorage, чтобы показать анимацию, 
        // но данные отправим боту через скрытую ссылку
        function startAnimation(price, type) {
            // Отправляем команду боту в фоне (через ссылку, чтобы не блокировалось)
            // Но сначала показываем анимацию
            let overlay = document.getElementById('overlay');
            let case3d = document.getElementById('case3d');
            let winCard = document.getElementById('win-card');
            let winText = document.getElementById('win-text');

            overlay.style.display = 'flex';
            case3d.style.transform = 'translateZ(0) scale(1)';
            
            // Эмуляция разлетающихся предметов
            setTimeout(() => {
                case3d.style.transform = 'translateZ(300px) scale(2) rotate(15deg)';
                
                // Спавним предметы
                for (let i = 0; i < 20; i++) {
                    let item = document.createElement('div');
                    item.className = 'flying-item';
                    item.innerText = ['💰', '🇺🇸', '🎁', '⭐', '🔥'][Math.floor(Math.random() * 5)];
                    item.style.left = '50%';
                    item.style.top = '50%';
                    overlay.appendChild(item);
                    
                    setTimeout(() => {
                        let x = (Math.random() - 0.5) * 800;
                        let y = (Math.random() - 0.5) * 800;
                        item.style.transform = `translate(${x}px, ${y}px) scale(1.5) rotate(${Math.random()*360}deg)`;
                        item.style.opacity = '1';
                    }, 50);
                }
            }, 500);

            // Через 2.5 секунды показываем результат
            setTimeout(() => {
                case3d.style.opacity = '0';
                winCard.style.display = 'block';
                setTimeout(() => { winCard.classList.add('active'); }, 50);
                
                // Тут можно показать конкретный приз (рандом)
                let prizes = ["📱 США за 50₽", "🎁 Промокод 10%", "💰 5 Рублей", "🔥 США за 300₽"];
                winText.innerText = "🎉 Вы выиграли:\n" + prizes[Math.floor(Math.random() * prizes.length)];
            }, 2500);

            // Отправляем данные в бота (открываем бота в фоне, чтобы списать деньги)
            // ВАЖНО: В реальности это делается через web_app, но для надежности мы просто
            // отправляем команду через скрытый iframe или location.href
            setTimeout(() => {
                window.location.href = `https://t.me/sciptyy_storebot?start=buy_${type}_${price}`;
            }, 5000); // Перекидываем в бота через 5 секунд
        }

        function finishGame() {
            window.location.href = `https://t.me/sciptyy_storebot`;
        }
    </script>
</body>
</html>
